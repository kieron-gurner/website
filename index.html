<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kieron Gurner, Product & Service Designer</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    height: 100%;
  }

  body {
    background-color: #FCFCFC;
    color: #222;
    font-family: Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    text-align: center;
  }

  .container {
    text-transform: uppercase;
    max-width: 480px;
    width: 100%;
  }

  h1 {
    font-size: clamp(1rem, 2.5vw, 1.25rem);
    letter-spacing: 0.02em;
    font-weight: 700;
    margin-bottom: 0.25rem;
  }

  p {
    font-size: clamp(0.8rem, 2.5vw, 1rem);
    letter-spacing: 0.02em;
    margin-bottom: 0.25rem;
    color: #222;
  }

  a {
    display: inline-block;
    text-decoration: none;
    font-size: clamp(0.8rem, 2.5vw, 1rem);
    letter-spacing: 0.02em;
    /*font-weight: 700;*/
    border-bottom: 2px solid #BEFF56;
    padding-bottom: 2px;
    transition: opacity 0.3s ease;
  }

  a:hover,
  a:focus {
    opacity: 0.6;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>Kieron Gurner</h1>
    <p>Product &amp; Service Designer</p>
    <a href="https://www.linkedin.com/in/kieron-gurner-61105331/" target="_blank" rel="noopener noreferrer">Contact on LinkedIn</a>
  </div>
</body>
</html>
